<body>

  <h1 id="testTitle">Lesson Test</h1>

  <button id="testButton" type="button">
    Start Lesson
  </button>

  <div id="lessonArea"></div>

  <script>
    document
      .getElementById("testButton")
      .addEventListener("click", function () {

        document.getElementById("lessonArea").innerHTML = `
          <h2>Lesson Opened Successfully!</h2>
          <p>The Start Lesson button is working.</p>
        `;

      });
  </script>

</body>
