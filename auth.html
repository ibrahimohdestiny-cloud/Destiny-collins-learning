<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | Collins Academy</title>
  <meta
    name="description"
    content="Log in to Collins Academy and continue learning digital skills."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

  <header class="top">
    <a href="index.html" class="brand">
      <span class="mark">C</span>
      COLLINS-ACADEMY
    </a>

    <a href="index.html">← Home</a>
  </header>

  <main class="auth-wrap">

    <section class="auth-card">

      <p class="eyebrow">COLLINS ACADEMY</p>

      <h1>Student Access</h1>

      <p class="muted">
        Log in to continue learning or create a new student account.
      </p>

      <div class="tabs">

        <button
          type="button"
          class="tab active"
          id="loginTab"
        >
          Log in
        </button>

        <button
          type="button"
          class="tab"
          id="signupTab"
        >
          Create account
        </button>

      </div>


      <!-- LOGIN FORM -->

      <form id="loginForm" novalidate>

        <label for="loginEmail">
          Email address

          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          >
        </label>


        <label for="loginPassword">
          Password

          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Your password"
          >
        </label>


        <button
          class="btn wide"
          type="submit"
          id="loginButton"
        >
          Log in
        </button>

      </form>


      <!-- SIGNUP FORM -->

      <form id="signupForm" hidden novalidate>

        <label for="fullName">
          Full name

          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            maxlength="80"
            required
            placeholder="Your full name"
          >
        </label>


        <label for="signupEmail">
          Email address

          <input
            id="signupEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          >
        </label>


        <label for="signupPassword">
          Password

          <input
            id="signupPassword"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            placeholder="At least 8 characters"
          >
        </label>


        <button
          class="btn wide"
          type="submit"
          id="signupButton"
        >
          Create my account
        </button>

      </form>


      <p
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></p>


      <p class="tiny">
        Welcome to Collins Academy.
      </p>

    </section>

  </main>


  <!-- Supabase login logic -->
  <script
    type="module"
    src="auth.js?v=20"
  ></script>

</body>
</html>
