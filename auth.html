<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | Collins Academy</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

  <header class="top">

    <a href="index.html" class="brand">
      <span class="mark">C</span>
      COLLINS-ACADEMY
    </a>

    <a href="index.html">← Home</a>

  </header>


  <main class="auth-wrap">

    <section class="auth-card">

      <p class="eyebrow">COLLINS ACADEMY</p>

      <h1>Student Access</h1>

      <p class="muted">
        Log in to continue learning or create a new student account.
      </p>


      <div class="tabs">

        <button
          type="button"
          class="tab active"
          id="loginTab"
        >
          Log in
        </button>

        <button
          type="button"
          class="tab"
          id="signupTab"
        >
          Create account
        </button>

      </div>


      <!-- LOGIN FORM -->

      <form id="loginForm">

        <label>
          Email address

          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          >

        </label>


        <label>
          Password

          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Your password"
          >

        </label>


        <button
          class="btn wide"
          type="submit"
          id="loginButton"
        >
          Log in
        </button>

      </form>


      <!-- CREATE ACCOUNT FORM -->

      <form id="signupForm" hidden>

        <label>
          Full name

          <input
            id="fullName"
            name="fullName"
            type="text"
            required
            maxlength="80"
            placeholder="Your full name"
          >

        </label>


        <label>
          Email address

          <input
            id="signupEmail"
            name="email"
            type="email"
            required
            placeholder="you@example.com"
          >

        </label>


        <label>
          Password

          <input
            id="signupPassword"
            name="password"
            type="password"
            minlength="8"
            required
            placeholder="At least 8 characters"
          >

        </label>


        <button
          class="btn wide"
          type="submit"
          id="signupButton"
        >
          Create my account
        </button>

      </form>


      <p
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></p>


      <p class="tiny">
        Welcome to Collins Academy.
      </p>

    </section>

  </main>


  <script
    type="module"
    src="auth.js?v=11"
  ></script>

</body>

</html>
