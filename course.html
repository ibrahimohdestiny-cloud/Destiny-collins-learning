<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Classroom | Collins Academy</title>

  <meta
    name="description"
    content="Learn digital skills with Collins Academy."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navigation -->
  <header class="top">

    <a href="dashboard.html" class="brand">
      <span class="mark">C</span>
      COLLINS-ACADEMY
    </a>

    <a href="dashboard.html">
      ← Dashboard
    </a>

  </header>


  <!-- Classroom -->
  <main class="dash">

    <p class="eyebrow">
      COLLINS ACADEMY CLASSROOM
    </p>

    <h1 id="courseTitle">
      Loading course...
    </h1>

    <p
      id="courseDescription"
      class="muted"
    >
      Loading course information...
    </p>


    <!-- Lessons -->
    <section
      id="lessonList"
      class="lesson-list"
      aria-live="polite"
    >
      <p>
        Loading lessons...
      </p>
    </section>


    <!-- Messages -->
    <p
      id="courseMessage"
      class="message"
      role="status"
      aria-live="polite"
    ></p>

  </main>


  <!-- Classroom JavaScript -->
  <script
    type="module"
    src="course.js?v=12"
  ></script>

</body>
</html>
